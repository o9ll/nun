name: Release MacOS Installer

on:
    workflow_dispatch:
    #workflow_call:

env:
    GH_TOKEN: ${{ github.token }}

permissions:
    contents: write

jobs:
    Upload:
        name: Upload MacOS Installer Script
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Upload NunMacOSInstaller.sh to release
              run: |
                  gh release upload v1.0.0-stable --clobber installer/NunMacOSInstaller.sh
